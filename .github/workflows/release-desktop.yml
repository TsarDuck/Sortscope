name: Release Sortscope desktop apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  verify:
    name: Verify Sortscope
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  release:
    name: Package ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            platform: windows-latest
            args: --bundles nsis
          - label: Linux x64
            platform: ubuntu-22.04
            args: --bundles appimage
          - label: macOS Apple Silicon
            platform: macos-latest
            args: --bundles dmg --target aarch64-apple-darwin
          - label: macOS Intel
            platform: macos-latest
            args: --bundles dmg --target x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Tauri's documented macOS matrix installs both release targets.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - name: Enable ad-hoc macOS signing
        if: matrix.platform == 'macos-latest'
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Sortscope v__VERSION__
          releaseBody: |
            Download the Windows setup file on Windows, the AppImage on Linux,
            or the macOS DMG that matches your Mac's processor.
            The app works fully offline after installation.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          releaseAssetNamePattern: Sortscope_[version]_[platform]_[arch][setup][ext]
          args: ${{ matrix.args }}
