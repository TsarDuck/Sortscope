<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Sortscope app icon</title>
  <desc id="description">Three dark sorting bars on a cyan, violet, and lavender rounded square.</desc>
  <defs>
    <linearGradient id="sortscope-gradient" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#58d9f5" />
      <stop offset="57%" stop-color="#8d7dff" />
      <stop offset="100%" stop-color="#d8a3ff" />
    </linearGradient>
  </defs>

  <!-- The transparent outer margin keeps the mark clear of platform masks. -->
  <rect x="96" y="96" width="832" height="832" rx="266" fill="url(#sortscope-gradient)" />

  <!-- These dimensions preserve the header mark's exact 25 px proportions. -->
  <g fill="#13172e">
    <rect x="262" y="296" width="500" height="100" rx="50" />
    <rect x="262" y="496" width="500" height="100" rx="50" />
    <rect x="262" y="695" width="500" height="100" rx="50" />
  </g>
</svg>
