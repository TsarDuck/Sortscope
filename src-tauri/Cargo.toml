[package]
name = "sortscope"
version = "1.0.0"
description = "An interactive desktop visualizer for learning sorting algorithms."
authors = ["Sortscope contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sortscope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
